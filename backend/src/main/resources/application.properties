server.port=8081
spring.application.name=Project Saloon Backend

# Swagger Config
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs



# JWT Secret
jwt.secret=${JWT_SECRET:your_super_secret_jwt_key_saloon_which_must_be_long_enough}

# Configure all three values to use Twilio Verify. Keep them outside source control.
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}

# Only used by the local fallback when Twilio is not configured.
otp.expose-code=${OTP_EXPOSE_CODE:false}
